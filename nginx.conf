# nginx im Container: liefert die statischen Dateien auf Port 80 aus.
# TLS gehört vor den Container.

# IP-Adressen in Logs kürzen (IPv4: letztes Oktett, IPv6: nach /48) – DSGVO-freundlich
map $remote_addr $ip_anon {
    ~(?P<ip>\d+\.\d+\.\d+)\.\d+      $ip.0;
    ~(?P<ip>[^:]+:[^:]+:[^:]+):      $ip::;
    default                          0.0.0.0;
}

log_format anon '$ip_anon - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Echte Besucher-IP aus X-Forwarded-For übernehmen, wenn die Anfrage aus einem privaten Netz kommt
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    access_log /var/log/nginx/access.log anon;
    server_tokens off;
    charset utf-8;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Eigene Fehlerseite statt der nginx-Standardseite (auch für gesperrte Pfade)
    error_page 403 404 /404.html;
    location = /404.html { internal; }

    # Kein langes Caching: Browser fragen per ETag nach, ob sich etwas geändert hat.
    # So sind Änderungen sofort sichtbar, die Seite ist klein genug.
    add_header Cache-Control "no-cache" always;

    # Keine Repo-Interna ausliefern
    location ~ /\. { deny all; }
}
