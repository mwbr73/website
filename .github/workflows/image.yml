name: Build image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check HTML links to local files
        run: |
          missing=0
          for f in index.html impressum.html 404.html; do
            for ref in $(grep -oE '(href|src)="[^"#:?]+"' "$f" | sed -E 's/.*="([^"]+)"/\1/'); do
              ref="${ref#/}"   # absolute Pfade (404.html) relativ zum Repo prüfen
              case "$ref" in ""|./|*/) continue ;; esac
              # Foto und Lebenslauf sind optional (Fallback bzw. versteckter Button)
              case "$ref" in assets/img/portrait.jpg|assets/cv/*) continue ;; esac
              [ -e "$ref" ] || { echo "::error file=$f::fehlt: $ref"; missing=1; }
            done
          done
          exit $missing

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
